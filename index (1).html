<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album Ảnh Gia Đình</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 { color: #333; margin-bottom: 10px; }
    p { color: #666; margin-bottom: 30px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .card:hover { transform: scale(1.03); }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .caption {
      padding: 12px;
      font-size: 15px;
      color: #444;
    }
  </style>
</head>
<body>

  <h1>Album Kỷ Niệm Gia Đình</h1>
  <p>Những khoảnh khắc đáng nhớ của cả nhà</p>

  <div class="gallery">
    <div class="card">
      <img src="images/anh3.jfif" alt="Ảnh 1">
      <div class="caption">Chuyến đi chơi mùa hè 2026</div>
    </div>
    <div class="card">
      <img src="images/anh1.jfif" alt="Ảnh 2">
      <div class="caption">Happy birthday Vũ Nhật Minh</div>
    </div>
    <div class="card">
      <img src="images/anh2.jfif" alt="Ảnh 3">
      <div class="caption">Sinh nhật cả nhà</div>
    </div>
  </div>

</body>
</html>
